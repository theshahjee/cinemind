services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cinemind
      POSTGRES_PASSWORD: cinemind
      POSTGRES_DB: cinemind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinemind"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://cinemind:cinemind@db:5432/cinemind
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://cinemind:cinemind@db:5432/cinemind
      IMPORT_DIR: /import
    volumes:
      # Drop IMDb exports into ./data/import; they're imported within a minute.
      - ./data/import:/import
    depends_on:
      api:
        condition: service_started

  # Remote MCP connector for Claude and ChatGPT. Only start it if you'll expose it over HTTPS:
  #   docker compose --profile connector up
  mcp:
    profiles: ["connector"]
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://cinemind:cinemind@db:5432/cinemind
      CINEMIND_API_URL: http://api:4000
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CINEMIND_API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
